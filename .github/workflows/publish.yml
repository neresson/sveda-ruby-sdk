name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  rubygems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake test
      - run: gem build sveda-ruby-sdk.gemspec
      - name: Push gem
        uses: rubygems/release-gem@v1

      - name: Trigger sveda SDK compatibility matrix
        if: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN }}
          repository: neresson/sveda
          event-type: sdk-release
          client-payload: '{"sdk":"ruby","version":"${{ github.ref_name }}"}'
